<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Heatmap Dashboard</title>
<link rel="stylesheet" href="./style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';
import { genCode, escapeHtml, basename } from './shared.js';

const app = document.getElementById('app');
const params = new URLSearchParams(location.search);

let sessionId = params.get('session') || genCode();
let protoSrc = params.get('src') || '';
let W = Number(params.get('w')) || 430;
let H = Number(params.get('h')) || 900;
let rippleSize = Number(params.get('rs')) || 34;
let rippleColor = params.get('rc') || '#ff4040';
let rippleDuration = Number(params.get('rd')) || 800;
let cachedProtoList = null;

function hexToRgb(hex) {
  hex = String(hex).replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
  const num = parseInt(hex, 16);
  if (isNaN(num)) return '255,64,64';
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255].join(',');
}

// Generic "save this as a file" helper, shared by the PNG and CSV exports.
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
function downloadCanvasAsPng(canvas, filename) {
  canvas.toBlob(function (blob) { if (blob) downloadBlob(blob, filename); }, 'image/png');
}

function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set('session', sessionId);
  if (protoSrc) u.searchParams.set('src', protoSrc); else u.searchParams.delete('src');
  u.searchParams.set('w', W);
  u.searchParams.set('h', H);
  u.searchParams.set('rs', rippleSize);
  u.searchParams.set('rc', rippleColor);
  u.searchParams.set('rd', rippleDuration);
  history.replaceState(null, '', u.toString());
}
syncUrl();

function playLink() {
  const u = new URL(location.href);
  u.pathname = u.pathname.replace(/watch\.html$/, 'play.html');
  u.search = '';
  u.searchParams.set('session', sessionId);
  u.searchParams.set('src', protoSrc);
  return u.toString();
}
function watchLink() {
  const u = new URL(location.href);
  u.search = '';
  u.searchParams.set('session', sessionId);
  if (protoSrc) u.searchParams.set('src', protoSrc);
  u.searchParams.set('w', W);
  u.searchParams.set('h', H);
  u.searchParams.set('rs', rippleSize);
  u.searchParams.set('rc', rippleColor);
  u.searchParams.set('rd', rippleDuration);
  return u.toString();
}
function resolveHref(p) {
  if (!p) return 'about:blank';
  if (/^https?:\/\//.test(p)) return p;
  if (p.startsWith('/')) return location.origin + p;
  return p;
}
function fromRow(r) {
  return { _id: r.id, type: r.type, screenId: r.screen_id, x: r.x, y: r.y, hit: r.hit, target: r.target, t: r.t };
}

// Lists subfolders of /prototypes in this repo via the GitHub API (works for
// any public repo hosted on GitHub Pages, no auth needed). Falls back to an
// empty list (dropdown just shows "Custom path") if this isn't on github.io,
// the repo is private, or the API rate limit is hit.
async function listPrototypes() {
  if (cachedProtoList) return cachedProtoList;
  cachedProtoList = [];
  try {
    if (!/\.github\.io$/.test(location.hostname)) return cachedProtoList;
    const owner = location.hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0];
    if (!owner || !repo) return cachedProtoList;
    const resp = await fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/prototypes');
    if (!resp.ok) return cachedProtoList;
    const items = await resp.json();
    if (!Array.isArray(items)) return cachedProtoList;
    cachedProtoList = items
      .filter(function (i) { return i.type === 'dir'; })
      .map(function (i) { return { name: i.name, path: 'prototypes/' + i.name + '/index.html' }; });
  } catch (e) { cachedProtoList = []; }
  return cachedProtoList;
}

init();

async function init() {
  let supabase;
  try {
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    app.innerHTML = '<div class="panel"><h1>Could not connect</h1><p>Check supabase-config.js has real values.</p></div>';
    return;
  }
  await supabase.from('sessions').upsert({ id: sessionId, status: 'active' });

  // Adopt the tester's actual device size automatically, so the mirror's
  // aspect ratio matches theirs instead of an arbitrary guess - unless the
  // width/height have been set manually via Apply.
  try {
    const { data } = await supabase.from('sessions').select('w,h').eq('id', sessionId).single();
    if (data && data.w && data.h && !manualSize) { W = data.w; H = data.h; }
  } catch (e) {}

  supabase
    .channel('session-' + sessionId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions', filter: 'id=eq.' + sessionId }, function (payload) {
      const w = payload.new && payload.new.w;
      const h = payload.new && payload.new.h;
      if (w && h && !manualSize && (w !== W || h !== H)) {
        W = w; H = h;
        render(supabase);
      }
    })
    .subscribe();

  render(supabase);
}

let currentChannel = null;
let manualSize = false;

async function render(supabase) {
  const protoList = await listPrototypes();
  const knownMatch = protoList.some(function (p) { return p.path === protoSrc; });
  const showCustom = !protoSrc || !knownMatch || protoList.length === 0;

  const optionsHtml = protoList.map(function (p) {
    const sel = p.path === protoSrc ? ' selected' : '';
    return '<option value="' + escapeHtml(p.path) + '"' + sel + '>' + escapeHtml(p.name) + '</option>';
  }).join('') + '<option value="__custom__"' + (showCustom ? ' selected' : '') + '>Custom path&hellip;</option>';

  app.innerHTML =
    '<h1>Tap Heatmap &mdash; Live Session</h1>' +
    '<div class="sub">Session code: <b>' + sessionId + '</b></div>' +

    '<div class="panel">' +
      '<h2>Prototype</h2>' +
      '<div class="setup-form">' +
        (protoList.length
          ? '<div><label>Choose prototype</label><select id="srcSelect" style="width:220px">' + optionsHtml + '</select></div>'
          : '') +
        '<div id="customWrap" style="display:' + (showCustom ? 'block' : 'none') + ';">' +
          '<label>Entry file (path in this repo)</label>' +
          '<input id="srcInput" style="width:280px" placeholder="prototypes/demo/index.html" value="' + escapeHtml(protoSrc) + '">' +
        '</div>' +
        '<div><label>Mirror width</label><input id="wInput" style="width:70px" value="' + W + '"></div>' +
        '<div><label>Mirror height</label><input id="hInput" style="width:70px" value="' + H + '"></div>' +
        '<div><label>Indicator size (<span id="rsVal">' + rippleSize + '</span>px)</label><input id="rsInput" type="range" min="10" max="100" step="2" style="width:140px" value="' + rippleSize + '"></div>' +
        '<div><label>Indicator color</label><input id="rcInput" type="color" style="width:50px;padding:2px;" value="' + rippleColor + '"></div>' +
        '<div><label>Indicator permanence (<span id="rdVal">' + rippleDuration + '</span>ms)</label><input id="rdInput" type="range" min="200" max="4000" step="100" style="width:140px" value="' + rippleDuration + '"></div>' +
        '<button id="applyBtn">Apply</button>' +
      '</div>' +
      '<p class="footer-note" style="margin-top:10px;text-align:left;">Mirror width/height auto-match the tester\'s device once they connect &mdash; only change these if you want to override that.</p>' +
    '</div>' +

    '<div class="panel">' +
      '<h2>Links</h2>' +
      '<div class="link-row"><label>Tester link</label><input readonly id="playUrl" value="' + playLink() + '"><button class="copy-btn" data-copy="playUrl">Copy</button></div>' +
      '<div class="link-row"><label>Watch link</label><input readonly id="watchUrl" value="' + watchLink() + '"><button class="copy-btn ghost" data-copy="watchUrl">Copy</button></div>' +
      '<button class="ghost" id="newSessionBtn">Start new session</button>' +
      '<button class="ghost" id="restartBtn">Restart tester&rsquo;s prototype</button>' +
      '<span id="copyMsg" class="copied"></span>' +
    '</div>' +

    '<div class="layout">' +
      '<div class="col">' +
        '<div class="panel">' +
          '<h2><span class="status-dot" id="statusDot"></span>Live mirror</h2>' +
          '<div class="stage"><div class="frame-wrap" id="mirrorWrap"><iframe id="mirrorFrame"></iframe>' +
            '<div class="waiting" id="waitingMsg">Waiting for tester to open the link&hellip;</div>' +
          '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="col">' +
        '<div class="panel">' +
          '<h2>Session stats</h2>' +
          '<div class="stats-row" id="statsRow"></div>' +
          '<div class="insight" id="insight" style="display:none;"></div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="panel">' +
      '<h2>Heatmap report</h2>' +
      '<button class="ghost" id="exportCsvBtn" style="margin-bottom:14px;">Export raw data (CSV)</button>' +
      '<div class="report-grid" id="reportGrid"></div>' +
    '</div>' +

    '<p class="footer-note">This session\'s data is stored under session code ' + sessionId + '.</p>';

  document.querySelectorAll('[data-copy]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const input = document.getElementById(btn.dataset.copy);
      input.select();
      try { navigator.clipboard.writeText(input.value); } catch (e) {}
      try { document.execCommand('copy'); } catch (e) {}
      const msg = document.getElementById('copyMsg');
      msg.textContent = 'Copied!';
      setTimeout(function () { msg.textContent = ''; }, 1500);
    });
  });
  document.getElementById('newSessionBtn').addEventListener('click', function () {
    const u = new URL(location.href);
    u.search = '';
    u.searchParams.set('session', genCode());
    if (protoSrc) u.searchParams.set('src', protoSrc);
    u.searchParams.set('w', W);
    u.searchParams.set('h', H);
    location.href = u.toString();
  });
  document.getElementById('restartBtn').addEventListener('click', function () {
    supabase.from('sessions').update({ restart_at: Date.now() }).eq('id', sessionId).then(function (res) {
      if (res.error) console.warn(res.error);
    });
    resetMirror();
  });
  document.getElementById('exportCsvBtn').addEventListener('click', function () { exportCsv(); });

  const rsInput = document.getElementById('rsInput');
  const rsVal = document.getElementById('rsVal');
  rsInput.addEventListener('input', function () { rsVal.textContent = rsInput.value; });

  const rdInput = document.getElementById('rdInput');
  const rdVal = document.getElementById('rdVal');
  rdInput.addEventListener('input', function () { rdVal.textContent = rdInput.value; });

  const srcSelect = document.getElementById('srcSelect');
  const customWrap = document.getElementById('customWrap');
  if (srcSelect) {
    srcSelect.addEventListener('change', function () {
      customWrap.style.display = srcSelect.value === '__custom__' ? 'block' : 'none';
    });
  }
  document.getElementById('applyBtn').addEventListener('click', function () {
    if (srcSelect && srcSelect.value !== '__custom__') {
      protoSrc = srcSelect.value;
    } else {
      protoSrc = document.getElementById('srcInput').value.trim();
    }
    W = Number(document.getElementById('wInput').value) || 430;
    H = Number(document.getElementById('hInput').value) || 900;
    manualSize = true;
    rippleSize = Number(document.getElementById('rsInput').value) || 34;
    rippleColor = document.getElementById('rcInput').value || '#ff4040';
    rippleDuration = Number(document.getElementById('rdInput').value) || 800;
    syncUrl();
    render(supabase);
  });

  document.documentElement.style.setProperty('--ripple-size', rippleSize + 'px');
  document.documentElement.style.setProperty('--ripple-rgb', hexToRgb(rippleColor));
  document.documentElement.style.setProperty('--ripple-duration', rippleDuration + 'ms');

  // ---------- live mirror ----------
  const mirrorWrap = document.getElementById('mirrorWrap');
  const mirrorFrame = document.getElementById('mirrorFrame');
  const waitingMsg = document.getElementById('waitingMsg');
  const statusDot = document.getElementById('statusDot');
  mirrorWrap.style.width = W + 'px';
  mirrorWrap.style.height = H + 'px';

  function fitMirror() {
    const stageEl = mirrorWrap.parentElement;
    const availW = stageEl.clientWidth - 40;
    const availH = 560;
    const scale = Math.min(1, availW / W, availH / H);
    mirrorWrap.style.transform = 'scale(' + scale + ')';
  }
  fitMirror();
  window.addEventListener('resize', fitMirror);

  let mirrorCurrent = null;
  let mirrorReady = false;
  let pendingReplays = [];

  mirrorFrame.addEventListener('load', function () {
    mirrorReady = true;
    const queue = pendingReplays;
    pendingReplays = [];
    queue.forEach(function (pt) {
      if (pt.kind === 'scroll') doScroll(mirrorFrame, pt.x, pt.y); else doReplayClick(mirrorFrame, pt.x, pt.y);
    });
  });

  // Generic replay helpers - work against any iframe, not just the live
  // mirror, so the same logic can also reconstruct historical screens for
  // the heatmap report below.
  function doScroll(targetFrame, x, y) {
    try { targetFrame.contentWindow.scrollTo(x, y); } catch (e) {}
  }

  function doReplayClick(targetFrame, x, y) {
    let doc;
    try { doc = targetFrame.contentDocument; } catch (e) { doc = null; }
    if (!doc) return;
    try {
      const cx = x * W, cy = y * H;
      const el = doc.elementFromPoint(cx, cy);
      if (!el) return;
      const win = targetFrame.contentWindow;
      const base = { bubbles: true, cancelable: true, composed: true, clientX: cx, clientY: cy, view: win };
      ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'].forEach(function (type) {
        let evt;
        try {
          evt = type.indexOf('pointer') === 0
            ? new win.PointerEvent(type, Object.assign({}, base, { pointerType: 'touch', isPrimary: true }))
            : new win.MouseEvent(type, base);
        } catch (e) {
          try { evt = new MouseEvent(type, base); } catch (e2) { evt = null; }
        }
        if (evt) el.dispatchEvent(evt);
      });
    } catch (e) {}
  }

  // Replays a recorded sequence of taps/scrolls into a freshly-loaded iframe,
  // one step at a time, to reconstruct a screen that has no real URL of its
  // own (a single-page prototype's JS-driven state).
  function replayRecipeInto(targetFrame, recipe) {
    let i = 0;
    function step() {
      if (i >= recipe.length) return;
      const item = recipe[i++];
      if (item.kind === 'scroll') doScroll(targetFrame, item.x, item.y);
      else doReplayClick(targetFrame, item.x, item.y);
      setTimeout(step, 40);
    }
    step();
  }

  // Simulates a tap inside the mirror by replaying the same event sequence at
  // the same relative position - used when a tap didn't cause a real
  // navigation (e.g. a single-page prototype that toggles screens via JS),
  // so the mirror's own script re-creates the same state change the tester
  // sees.
  function replayTap(x, y) {
    if (mirrorReady) doReplayClick(mirrorFrame, x, y); else pendingReplays.push({ x: x, y: y });
  }

  function replayScroll(x, y) {
    if (mirrorReady) doScroll(mirrorFrame, x, y); else pendingReplays.push({ kind: 'scroll', x: x, y: y });
  }

  function showMirror(screenId) {
    if (!screenId || mirrorCurrent === screenId) return false;
    mirrorCurrent = screenId;
    mirrorReady = false;
    pendingReplays = [];
    mirrorFrame.src = resolveHref(screenId);
    return true;
  }

  // Forces the mirror back to the entry page, even if it's already showing
  // it (same screen_id) - needed for single-page prototypes where the
  // screen never actually changes URL, so a plain showMirror() would be a
  // no-op.
  function resetMirror() {
    mirrorReady = false;
    pendingReplays = [];
    if (!protoSrc) return;
    const bust = protoSrc.indexOf('?') >= 0 ? '&' : '?';
    mirrorFrame.src = resolveHref(protoSrc) + bust + '_r=' + Date.now();
    mirrorCurrent = protoSrc;
  }

  if (protoSrc) showMirror(protoSrc);

  function showRipple(x, y) {
    const d = document.createElement('div');
    d.className = 'ripple';
    d.style.left = (x * W) + 'px';
    d.style.top = (y * H) + 'px';
    mirrorWrap.appendChild(d);
    setTimeout(function () { d.remove(); }, rippleDuration);
  }

  // ---------- report grid (built dynamically per screen seen) ----------
  const reportGrid = document.getElementById('reportGrid');
  const reportCells = {};
  const THUMB_W = 160;

  function ensureCell(screenId) {
    if (reportCells[screenId]) return reportCells[screenId];
    const cell = document.createElement('div');
    cell.className = 'report-cell';
    const thumbH = Math.round(THUMB_W * (H / W));
    // A screen id with no real URL (single-page prototype state) can't just
    // be loaded directly - start from the entry page instead, then replay
    // the taps that got there the first time, once it's loaded.
    const isSynthetic = screenId.indexOf('#state:') !== -1;
    const initialSrc = isSynthetic ? resolveHref(protoSrc) : resolveHref(screenId);
    cell.innerHTML =
      '<div class="thumb-wrap" style="width:' + THUMB_W + 'px;height:' + thumbH + 'px;">' +
        '<iframe src="' + initialSrc + '" style="width:' + W + 'px;height:' + H + 'px;transform:scale(' + (THUMB_W / W) + ');transform-origin:top left;"></iframe>' +
        '<canvas width="' + THUMB_W + '" height="' + thumbH + '"></canvas>' +
      '</div>' +
      '<div class="label">' + escapeHtml(basename(screenId)) + ' &mdash; <span class="count">0</span> taps</div>' +
      '<button class="ghost dl-png-btn" style="margin-top:6px;font-size:0.72rem;padding:4px 10px;">Download PNG</button>';
    reportGrid.appendChild(cell);
    const iframeEl = cell.querySelector('iframe');
    const rec = { el: cell, canvas: cell.querySelector('canvas'), count: cell.querySelector('.count') };
    reportCells[screenId] = rec;

    cell.querySelector('.dl-png-btn').addEventListener('click', function () {
      if (!window.html2canvas) return;
      window.html2canvas(cell.querySelector('.thumb-wrap'), { useCORS: true, backgroundColor: '#fff' })
        .then(function (canvas) { downloadCanvasAsPng(canvas, basename(screenId) + '-heatmap.png'); })
        .catch(function () {});
    });

    if (isSynthetic) {
      const recipe = (stateRecipes[screenId] || []).slice();
      iframeEl.addEventListener('load', function onLoad() {
        iframeEl.removeEventListener('load', onLoad);
        replayRecipeInto(iframeEl, recipe);
      });
    }
    return rec;
  }

  let seen = {};
  let allEvents = [];
  // Ordered log of every tap/scroll so far this session, plus a snapshot of
  // that log at the moment each screen was first reached - used to
  // reconstruct screens that have no real URL (single-page JS state).
  let interactionsSoFar = [];
  let stateRecipes = {};

  function exportCsv() {
    const rows = [['type', 'screen_id', 'x', 'y', 'hit', 'target', 't']];
    allEvents.forEach(function (e) {
      rows.push([e.type, e.screenId, e.x, e.y, e.hit, e.target, e.t]);
    });
    const csv = rows.map(function (r) {
      return r.map(function (v) {
        if (v === null || v === undefined) return '';
        const s = String(v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\n');
    downloadBlob(new Blob([csv], { type: 'text/csv' }), 'session-' + sessionId + '.csv');
  }

  function redrawReport() {
    Object.keys(reportCells).forEach(function (screenId) {
      const rec = reportCells[screenId];
      const canvas = rec.canvas;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const taps = allEvents.filter(function (e) { return e.type === 'tap' && e.screenId === screenId && typeof e.x === 'number'; });
      rec.count.textContent = taps.length;
      ctx.globalCompositeOperation = 'lighter';
      taps.forEach(function (t) {
        const px = t.x * canvas.width, py = t.y * canvas.height;
        const grad = ctx.createRadialGradient(px, py, 0, px, py, 16);
        grad.addColorStop(0, 'rgba(255,45,45,0.5)');
        grad.addColorStop(1, 'rgba(255,45,45,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(px, py, 16, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalCompositeOperation = 'source-over';
    });
  }

  function redrawStats() {
    const taps = allEvents.filter(function (e) { return e.type === 'tap'; });
    const hits = taps.filter(function (e) { return e.hit; });
    const first = allEvents.length ? Math.min.apply(null, allEvents.map(function (e) { return e.t; })) : null;
    const last = allEvents.length ? Math.max.apply(null, allEvents.map(function (e) { return e.t; })) : null;
    const durationSec = (first && last) ? Math.round((last - first) / 1000) : 0;
    const missRate = taps.length ? Math.round(100 * (taps.length - hits.length) / taps.length) : 0;

    document.getElementById('statsRow').innerHTML =
      '<div class="stat"><b>' + taps.length + '</b>Total taps</div>' +
      '<div class="stat"><b>' + missRate + '%</b>Miss rate</div>' +
      '<div class="stat"><b>' + durationSec + 's</b>Session length</div>';

    const insight = document.getElementById('insight');
    const byScreen = {};
    taps.forEach(function (t) {
      byScreen[t.screenId] = byScreen[t.screenId] || { hit: 0, total: 0 };
      byScreen[t.screenId].total++;
      if (t.hit) byScreen[t.screenId].hit++;
    });
    let worst = null;
    Object.keys(byScreen).forEach(function (sid) {
      const d = byScreen[sid];
      if (d.total >= 2) {
        const rate = (d.total - d.hit) / d.total;
        if (!worst || rate > worst.rate) worst = { sid: sid, rate: rate, total: d.total };
      }
    });
    if (worst && worst.rate > 0.2) {
      insight.style.display = 'block';
      insight.textContent = basename(worst.sid) + ' had a ' + Math.round(worst.rate * 100) + '% miss rate across ' + worst.total + ' taps — taps are landing near, but not on, interactive elements.';
    } else {
      insight.style.display = 'none';
    }
  }

  function handleEvents() {
    if (allEvents.length) { waitingMsg.style.display = 'none'; statusDot.classList.add('live'); }
    allEvents.forEach(function (e) {
      if (seen[e._id]) return;
      seen[e._id] = true;

      if (e.screenId && !stateRecipes[e.screenId]) {
        stateRecipes[e.screenId] = interactionsSoFar.slice();
      }

      let navigated = false;
      if (e.screenId) {
        ensureCell(e.screenId);
        navigated = showMirror(e.screenId);
      }
      if (e.type === 'tap' && typeof e.x === 'number') {
        if (!navigated) replayTap(e.x, e.y);
        showRipple(e.x, e.y);
        interactionsSoFar.push({ kind: 'tap', x: e.x, y: e.y });
      }
      if (e.type === 'scroll' && typeof e.x === 'number') {
        if (!navigated) replayScroll(e.x, e.y);
        interactionsSoFar.push({ kind: 'scroll', x: e.x, y: e.y });
      }
    });
    redrawReport();
    redrawStats();
  }

  async function loadInitial() {
    const { data, error } = await supabase
      .from('events')
      .select('*')
      .eq('session_id', sessionId)
      .order('t', { ascending: true });
    if (error) { waitingMsg.textContent = 'Could not load session data.'; return; }
    allEvents = (data || []).map(fromRow);
    handleEvents();
  }
  loadInitial();

  if (currentChannel) {
    try { supabase.removeChannel(currentChannel); } catch (e) {}
  }
  currentChannel = supabase
    .channel('events-' + sessionId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events', filter: 'session_id=eq.' + sessionId }, function (payload) {
      allEvents.push(fromRow(payload.new));
      handleEvents();
    })
    .subscribe();
}
</script>
