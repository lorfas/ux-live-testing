<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;}
  #stage{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;display:none;}
  #protoFrame{display:block;border:0;width:100%;height:100%;}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#333;
       font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;text-align:center;font-size:0.95rem;}
  #startOverlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#111;}
  #startBtn{padding:16px 30px;font-size:1rem;font-weight:700;border:none;border-radius:12px;
            background:#5b5bd6;color:#fff;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
</style>
</head>
<body>
<div id="msg"></div>
<div id="startOverlay"><button id="startBtn">Tap to begin</button></div>
<div id="stage">
  <iframe id="protoFrame"></iframe>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';

const params = new URLSearchParams(location.search);
const sessionId = params.get('session');
const src = params.get('src');

const msgEl = document.getElementById('msg');
function fail(text) {
  msgEl.textContent = text;
  msgEl.style.display = 'flex';
  document.getElementById('startOverlay').style.display = 'none';
}

document.getElementById('startBtn').addEventListener('click', function () {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) { try { req.call(el); } catch (e) {} }
  document.getElementById('startOverlay').style.display = 'none';
});

if (!sessionId || !src) {
  fail('This link is missing information. Ask your test organizer for the correct link.');
} else {
  init();
}

async function init() {
  let supabase;
  try {
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    fail('Could not connect.');
    return;
  }

  function reportDeviceSize() {
    supabase.from('sessions').update({ w: window.innerWidth, h: window.innerHeight }).eq('id', sessionId).then(function () {});
  }
  supabase.from('sessions').upsert({ id: sessionId, status: 'active', w: window.innerWidth, h: window.innerHeight }).then(function () {});
  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(reportDeviceSize, 300);
  });

  const stage = document.getElementById('stage');
  const frame = document.getElementById('protoFrame');
  stage.style.display = 'block';

  let current = src;

  function logEvent(evt) {
    supabase.from('events').insert(Object.assign({
      session_id: sessionId,
      t: Date.now()
    }, evt)).then(function (res) { if (res.error) console.warn(res.error); });
  }

  // Uses the prototype's own current viewport size (whatever the tester's
  // real device gives it - no forced width/height), read fresh each time so
  // an orientation change or resize doesn't throw off the normalization.
  function frameSize() {
    try {
      return { w: frame.contentWindow.innerWidth, h: frame.contentWindow.innerHeight };
    } catch (e) {
      return { w: frame.clientWidth || 1, h: frame.clientHeight || 1 };
    }
  }

  function attach() {
    let doc;
    try { doc = frame.contentDocument; } catch (e) { doc = null; }
    if (!doc) return;

    let lastRouteChangeAt = 0;
    let basePath = src;
    try { basePath = frame.contentWindow.location.pathname; } catch (e) {}

    function updateScreen() {
      lastRouteChangeAt = Date.now();
      try {
        basePath = frame.contentWindow.location.pathname;
        current = basePath + frame.contentWindow.location.hash;
      } catch (e) {}
      logEvent({ type: 'nav', screen_id: current, x: null, y: null, hit: null, target: null });
    }
    updateScreen();

    // Catch SPA-style navigation that doesn't trigger a full page reload
    // (client-side routers using pushState/replaceState, or hash-based routes).
    try {
      const win = frame.contentWindow;
      const pushState = win.history.pushState;
      const replaceState = win.history.replaceState;
      win.history.pushState = function () { pushState.apply(this, arguments); updateScreen(); };
      win.history.replaceState = function () { replaceState.apply(this, arguments); updateScreen(); };
      win.addEventListener('hashchange', updateScreen);
      win.addEventListener('popstate', updateScreen);
    } catch (e) {}

    // Fallback for prototypes that change "screens" by toggling DOM
    // visibility with plain JS - no URL or hash change at all, so the
    // routing detection above never fires. Fingerprint which top-level
    // elements are currently visible; when that combination settles after a
    // burst of DOM changes, treat it as a distinct screen. Returning to a
    // previously-seen combination reuses the same screen id, so repeat
    // visits still group together in the heatmap.
    function visibleFingerprint() {
      try {
        const win = frame.contentWindow;
        const parts = [];
        Array.prototype.forEach.call(doc.body.children, function (el) {
          const style = win.getComputedStyle(el);
          if (style.display !== 'none' && style.visibility !== 'hidden' && !el.hidden) {
            parts.push(el.id || el.className || el.tagName);
          }
        });
        return parts.join('|') || 'default';
      } catch (e) { return 'default'; }
    }
    let mutTimer = null;
    try {
      const mo = new (frame.contentWindow.MutationObserver || MutationObserver)(function () {
        if (Date.now() - lastRouteChangeAt < 400) return;
        clearTimeout(mutTimer);
        mutTimer = setTimeout(function () {
          const candidate = basePath + '#state:' + visibleFingerprint();
          if (candidate !== current) {
            current = candidate;
            logEvent({ type: 'nav', screen_id: current, x: null, y: null, hit: null, target: null });
          }
        }, 250);
      });
      mo.observe(doc.body, { attributes: true, attributeFilter: ['class', 'style', 'hidden'], subtree: true, childList: true });
    } catch (e) {}

    doc.addEventListener('click', function (e) {
      const size = frameSize();
      const x = e.clientX / size.w;
      const y = e.clientY / size.h;
      let hit = false, label = null;
      const el = e.target;
      const interactive = el && el.closest ? el.closest('a,button,input,select,textarea,[onclick],[role="button"],[tabindex]') : null;
      if (interactive) {
        hit = true;
        label = (interactive.getAttribute('aria-label') || interactive.getAttribute('title') ||
          (interactive.textContent || '').trim() || interactive.tagName.toLowerCase()).slice(0, 60);
      }
      logEvent({ type: 'tap', screen_id: current, x: x, y: y, hit: hit, target: label });
    }, true);

    // Mirror scroll position too (covers drag-to-scroll / swipe gestures,
    // since those all end up firing native 'scroll' events regardless of
    // whether they came from touch, wheel, or trackpad input).
    let lastScrollLog = 0;
    frame.contentWindow.addEventListener('scroll', function () {
      const now = Date.now();
      if (now - lastScrollLog < 120) return;
      lastScrollLog = now;
      const se = doc.scrollingElement || doc.documentElement;
      logEvent({ type: 'scroll', screen_id: current, x: se.scrollLeft, y: se.scrollTop, hit: null, target: null });
    }, { passive: true });
  }

  frame.addEventListener('load', attach);
  frame.src = src;

  // Listen for a remote "restart" signal from the watch dashboard.
  let lastRestartAt = null;
  supabase
    .channel('session-ctl-' + sessionId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions', filter: 'id=eq.' + sessionId }, function (payload) {
      const r = payload.new && payload.new.restart_at;
      if (r != null && r !== lastRestartAt) {
        lastRestartAt = r;
        const bust = src.indexOf('?') >= 0 ? '&' : '?';
        frame.src = src + bust + '_r=' + Date.now();
      }
    })
    .subscribe();
}
</script>
</body>
</html>
