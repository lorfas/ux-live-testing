<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;overscroll-behavior:none;touch-action:none;}
  #stage{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;display:none;}
  #protoFrame{display:block;border:0;width:100%;height:100%;}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#333;
       font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;text-align:center;font-size:0.95rem;}
  #startOverlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#111;}
  #startBtn{padding:16px 30px;font-size:1rem;font-weight:700;border:none;border-radius:12px;
            background:#5b5bd6;color:#fff;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
</style>
</head>
<body>
<div id="msg"></div>
<div id="startOverlay"><button id="startBtn">Tap to begin</button></div>
<div id="stage">
  <iframe id="protoFrame"></iframe>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';

const params = new URLSearchParams(location.search);
const sessionId = params.get('session');
// `src` is optional now - the tester link is prototype-agnostic. If it's
// not on the URL (the normal case for a link generated by the current
// dashboard), it's looked up from the session's own row instead, and can
// arrive later too if the organizer hasn't picked one yet.
let src = params.get('src') || null;

const msgEl = document.getElementById('msg');
function fail(text) {
  msgEl.textContent = text;
  msgEl.style.display = 'flex';
  document.getElementById('startOverlay').style.display = 'none';
}

document.getElementById('startBtn').addEventListener('click', function () {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) { try { req.call(el); } catch (e) {} }
  document.getElementById('startOverlay').style.display = 'none';
});

if (!sessionId) {
  fail('This link is missing information. Ask your test organizer for the correct link.');
} else {
  init();
}

async function init() {
  let supabase;
  try {
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    fail('Could not connect.');
    return;
  }

  function reportDeviceSize() {
    supabase.from('sessions').update({ w: window.innerWidth, h: window.innerHeight }).eq('id', sessionId).then(function () {});
  }
  supabase.from('sessions').upsert({ id: sessionId, status: 'active', w: window.innerWidth, h: window.innerHeight }).then(function () {});
  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(reportDeviceSize, 300);
  });

  const stage = document.getElementById('stage');
  const frame = document.getElementById('protoFrame');

  // Off by default - the tester normally sees zero tracking UI. The
  // organizer can flip this on from the dashboard (live, mid-session) for
  // cases where it helps to have the tester see their own taps too.
  let showTapIndicator = false;

  // The prototype itself lives in the sessions row, not necessarily the
  // URL - look it up if it wasn't given directly. Also pick up the
  // tap-indicator preference from the same row.
  try {
    const { data } = await supabase.from('sessions').select('src, show_tap').eq('id', sessionId).single();
    if (!src && data && data.src) src = data.src;
    if (data) showTapIndicator = !!data.show_tap;
  } catch (e) {}

  let current = src || '';

  function logEvent(evt) {
    supabase.from('events').insert(Object.assign({
      session_id: sessionId,
      t: Date.now()
    }, evt)).then(function (res) { if (res.error) console.warn(res.error); });
  }

  // Uses the prototype's own current viewport size (whatever the tester's
  // real device gives it - no forced width/height), read fresh each time so
  // an orientation change or resize doesn't throw off the normalization.
  function frameSize() {
    try {
      return { w: frame.contentWindow.innerWidth, h: frame.contentWindow.innerHeight };
    } catch (e) {
      return { w: frame.clientWidth || 1, h: frame.clientHeight || 1 };
    }
  }

  // Injects the CSS for the on-screen tap indicator into the prototype's
  // own document (same-origin, so this is safe) - only drawn when
  // showTapIndicator is on. Idempotent per document load.
  function ensureTapRippleStyle(doc) {
    if (doc.getElementById('__tapRippleStyle')) return;
    const style = doc.createElement('style');
    style.id = '__tapRippleStyle';
    style.textContent =
      '.__tap-ripple{position:fixed;width:40px;height:40px;margin-left:-20px;margin-top:-20px;' +
      'border-radius:50%;border:3px solid rgba(91,91,214,0.85);background:rgba(91,91,214,0.18);' +
      'pointer-events:none;z-index:2147483647;animation:__tap-rip 450ms ease-out forwards;}' +
      '@keyframes __tap-rip{0%{transform:scale(0.3);opacity:1;}100%{transform:scale(2.2);opacity:0;}}';
    doc.head.appendChild(style);
  }

  function attach() {
    let doc;
    try { doc = frame.contentDocument; } catch (e) { doc = null; }
    if (!doc) return;
    ensureTapRippleStyle(doc);

    let lastRouteChangeAt = 0;
    let basePath = src;
    try { basePath = frame.contentWindow.location.pathname; } catch (e) {}

    // `current` is what actually gets logged as screen_id (it can carry a
    // scroll-depth suffix on top of the real screen - see
    // updateScrollDepth() below); `screenBase` is the underlying real
    // screen with no such suffix, so the depth bucket has something stable
    // to attach to and resets cleanly on every real screen change.
    let screenBase = src;
    let scrollDepthBucket = 0;

    function updateScreen() {
      lastRouteChangeAt = Date.now();
      try {
        basePath = frame.contentWindow.location.pathname;
        screenBase = basePath + frame.contentWindow.location.hash;
      } catch (e) {}
      scrollDepthBucket = 0;
      current = screenBase;
      logEvent({ type: 'nav', screen_id: current, x: null, y: null, hit: null, target: null });
    }
    updateScreen();

    // Catch SPA-style navigation that doesn't trigger a full page reload
    // (client-side routers using pushState/replaceState, or hash-based routes).
    try {
      const win = frame.contentWindow;
      const pushState = win.history.pushState;
      const replaceState = win.history.replaceState;
      win.history.pushState = function () { pushState.apply(this, arguments); updateScreen(); };
      win.history.replaceState = function () { replaceState.apply(this, arguments); updateScreen(); };
      win.addEventListener('hashchange', updateScreen);
      win.addEventListener('popstate', updateScreen);
    } catch (e) {}

    // Fallback for prototypes that change "screens" by toggling DOM
    // visibility with plain JS - no URL or hash change at all, so the
    // routing detection above never fires. Fingerprints three things: which
    // top-level elements are visible (a whole screen swap), which modals/
    // dialogs are currently open ANYWHERE in the page (not just top-level -
    // a modal is meaningfully a different "screen" even nested deep inside
    // the current one), and which controls are in an "on" state (a toggle,
    // a selected filter chip, an expanded accordion). When the combination
    // settles after a burst of DOM changes, treat it as a distinct screen.
    // Returning to a previously-seen combination reuses the same screen id,
    // so repeat visits still group together in the heatmap.
    //
    // The "on state" part only looks for standard ARIA state attributes
    // (aria-pressed/-selected/-expanded/-checked) and .active/.selected
    // classes - deliberately narrow, so incidental class/style churn
    // elsewhere (a scroll-driven header collapsing, an animation class)
    // doesn't spam new "screens" for every little visual change. A
    // prototype's buttons/filters/tabs need to actually set one of these to
    // be picked up - see the prototype compatibility checklist.
    function stateFingerprint() {
      try {
        const win = frame.contentWindow;
        const parts = [];
        Array.prototype.forEach.call(doc.body.children, function (el) {
          const style = win.getComputedStyle(el);
          if (style.display !== 'none' && style.visibility !== 'hidden' && !el.hidden) {
            parts.push(el.id || el.className || el.tagName);
          }
        });
        Array.prototype.forEach.call(doc.querySelectorAll('[role="dialog"],[aria-modal="true"],dialog[open]'), function (el) {
          const style = win.getComputedStyle(el);
          if (style.display !== 'none' && style.visibility !== 'hidden' && !el.hidden) {
            parts.push('modal:' + (el.id || el.className || el.tagName));
          }
        });
        Array.prototype.forEach.call(doc.querySelectorAll('[aria-pressed="true"],[aria-selected="true"],[aria-expanded="true"],[aria-checked="true"],.active,.selected'), function (el) {
          parts.push('on:' + (el.id || el.className || el.tagName));
        });
        return parts.join('|') || 'default';
      } catch (e) { return 'default'; }
    }
    let mutTimer = null;
    try {
      const mo = new (frame.contentWindow.MutationObserver || MutationObserver)(function () {
        if (Date.now() - lastRouteChangeAt < 400) return;
        clearTimeout(mutTimer);
        mutTimer = setTimeout(function () {
          const candidate = basePath + '#state:' + stateFingerprint();
          if (candidate !== screenBase) {
            screenBase = candidate;
            scrollDepthBucket = 0;
            current = screenBase;
            logEvent({ type: 'nav', screen_id: current, x: null, y: null, hit: null, target: null });
          }
        }, 250);
      });
      mo.observe(doc.body, {
        attributes: true,
        attributeFilter: ['class', 'style', 'hidden', 'open', 'aria-pressed', 'aria-selected', 'aria-expanded', 'aria-checked', 'aria-modal'],
        subtree: true,
        childList: true
      });
    } catch (e) {}

    doc.addEventListener('click', function (e) {
      const size = frameSize();
      const x = e.clientX / size.w;
      const y = e.clientY / size.h;
      let hit = false, label = null;
      const el = e.target;
      const interactive = el && el.closest ? el.closest('a,button,input,select,textarea,[onclick],[role="button"],[tabindex]') : null;
      if (interactive) {
        hit = true;
        label = (interactive.getAttribute('aria-label') || interactive.getAttribute('title') ||
          (interactive.textContent || '').trim() || interactive.tagName.toLowerCase()).slice(0, 60);
      }
      logEvent({ type: 'tap', screen_id: current, x: x, y: y, hit: hit, target: label });

      if (showTapIndicator) {
        const d = doc.createElement('div');
        d.className = '__tap-ripple';
        d.style.left = e.clientX + 'px';
        d.style.top = e.clientY + 'px';
        doc.body.appendChild(d);
        setTimeout(function () { d.remove(); }, 500);
      }
    }, true);

    // Builds a stable-ish CSS selector path for an element, so the watch
    // dashboard can find the SAME element again inside its own copy of the
    // prototype and replay a scroll onto it specifically (rather than only
    // ever scrolling the top-level page).
    function cssPath(el) {
      if (!el || el.nodeType !== 1 || el === doc.body) return '';
      const parts = [];
      let node = el;
      while (node && node.nodeType === 1 && node !== doc.body) {
        let part = node.tagName.toLowerCase();
        if (node.id) { parts.unshift(part + '#' + node.id); break; }
        let idx = 1, sib = node;
        while ((sib = sib.previousElementSibling)) { if (sib.tagName === node.tagName) idx++; }
        part += ':nth-of-type(' + idx + ')';
        parts.unshift(part);
        node = node.parentElement;
      }
      return parts.join('>');
    }

    // Mirror scroll position too (covers drag-to-scroll / swipe gestures,
    // since those all end up firing native 'scroll' events regardless of
    // whether they came from touch, wheel, or trackpad input).
    //
    // 'scroll' events don't bubble, but a capture-phase listener on the
    // document still sees them fire on ANY descendant during the capture
    // pass - so this catches scrolling inside nested scrollable containers
    // (a product list, a modal body, etc.), not just top-level page scroll.
    // Each scrolled element is tracked/throttled separately so scrolling two
    // different containers around the same time doesn't drop either one.
    // Splits a long single page into separate heatmap "pages" once the
    // tester has scrolled past roughly half a screen's worth and stopped
    // there - covers prototypes that reveal what's effectively a different
    // screen by scrolling rather than any navigation. Deliberately cheap:
    // just rounds scrollTop into half-viewport buckets (values already on
    // hand from the scroll listener below) and waits for scrolling to go
    // quiet before committing - no extra observers, no geometry queries.
    // Only applies to the top-level page, not inner scroll containers
    // (a product list, a modal), which are about repositioning content
    // rather than moving to a different "page".
    let scrollSettleTimer = null;
    function updateScrollDepth(scrollEl) {
      const vh = frame.contentWindow.innerHeight || 1;
      const bucket = Math.round(scrollEl.scrollTop / (vh / 2));
      clearTimeout(scrollSettleTimer);
      scrollSettleTimer = setTimeout(function () {
        if (bucket === scrollDepthBucket) return;
        scrollDepthBucket = bucket;
        current = bucket > 0 ? screenBase + '~~scroll:' + bucket : screenBase;
        logEvent({ type: 'nav', screen_id: current, x: null, y: null, hit: null, target: null });
      }, 400);
    }

    const lastScrollLogByTarget = new WeakMap();
    doc.addEventListener('scroll', function (e) {
      let el = e.target;
      if (!el || el.nodeType !== 1) el = null;
      const rootEl = doc.scrollingElement || doc.documentElement;
      const scrollEl = el || rootEl;
      const now = Date.now();
      const last = lastScrollLogByTarget.get(scrollEl) || 0;
      if (now - last < 120) return;
      lastScrollLogByTarget.set(scrollEl, now);
      const sel = scrollEl === rootEl ? '' : cssPath(scrollEl);
      logEvent({ type: 'scroll', screen_id: current, x: scrollEl.scrollLeft, y: scrollEl.scrollTop, hit: null, target: sel });
      if (scrollEl === rootEl) updateScrollDepth(scrollEl);
    }, true);
  }

  frame.addEventListener('load', attach);

  function loadPrototype(newSrc) {
    src = newSrc;
    current = src;
    msgEl.style.display = 'none';
    stage.style.display = 'block';
    frame.src = src;
  }

  if (src) {
    loadPrototype(src);
  } else {
    msgEl.textContent = 'Waiting for the test organizer to choose a prototype…';
    msgEl.style.display = 'flex';
  }

  // Listen for a remote "restart" signal from the watch dashboard, the
  // organizer switching to a different prototype mid-session (or choosing
  // one for the first time, if this link was opened before they had), and
  // the tap-indicator toggle - all come through the same sessions row.
  let lastRestartAt = null;
  supabase
    .channel('session-ctl-' + sessionId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions', filter: 'id=eq.' + sessionId }, function (payload) {
      if (payload.new) showTapIndicator = !!payload.new.show_tap;

      const s = payload.new && payload.new.src;
      if (s && s !== src) {
        loadPrototype(s);
        return;
      }
      const r = payload.new && payload.new.restart_at;
      if (r != null && r !== lastRestartAt && src) {
        lastRestartAt = r;
        const bust = src.indexOf('?') >= 0 ? '&' : '?';
        frame.src = src + bust + '_r=' + Date.now();
      }
    })
    .subscribe();
}
</script>
</body>
</html>
