<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;}
  #frameWrap{position:relative;transform-origin:center center;background:#fff;box-shadow:0 0 40px rgba(0,0,0,0.4);flex-shrink:0;}
  #frameWrap iframe{display:block;border:0;width:100%;height:100%;}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#eee;
       font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;text-align:center;font-size:0.95rem;}
  #startOverlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#111;}
  #startBtn{padding:16px 30px;font-size:1rem;font-weight:700;border:none;border-radius:12px;
            background:#5b5bd6;color:#fff;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
</style>
</head>
<body>
<div id="msg"></div>
<div id="startOverlay"><button id="startBtn">Tap to begin</button></div>
<div id="stage" style="display:none;">
  <div id="frameWrap"><iframe id="protoFrame"></iframe></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './supabase-config.js';

const params = new URLSearchParams(location.search);
const sessionId = params.get('session');
const src = params.get('src');
const W = Number(params.get('w')) || 430;
const H = Number(params.get('h')) || 900;

const msgEl = document.getElementById('msg');
function fail(text) {
  msgEl.textContent = text;
  msgEl.style.display = 'flex';
  document.getElementById('startOverlay').style.display = 'none';
}

document.getElementById('startBtn').addEventListener('click', function () {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) { try { req.call(el); } catch (e) {} }
  document.getElementById('startOverlay').style.display = 'none';
});

if (!sessionId || !src) {
  fail('This link is missing information. Ask your test organizer for the correct link.');
} else {
  init();
}

async function init() {
  let supabase;
  try {
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    fail('Could not connect.');
    return;
  }

  supabase.from('sessions').upsert({ id: sessionId, status: 'active' }).then(function () {});

  const stage = document.getElementById('stage');
  const frameWrap = document.getElementById('frameWrap');
  const frame = document.getElementById('protoFrame');
  frameWrap.style.width = W + 'px';
  frameWrap.style.height = H + 'px';
  stage.style.display = 'flex';

  function fit() {
    const pad = 24;
    const scale = Math.min(1, (window.innerWidth - pad * 2) / W, (window.innerHeight - pad * 2) / H);
    frameWrap.style.transform = 'scale(' + scale + ')';
  }
  fit();
  window.addEventListener('resize', fit);

  let current = src;

  function logEvent(evt) {
    supabase.from('events').insert(Object.assign({
      session_id: sessionId,
      t: Date.now()
    }, evt)).then(function (res) { if (res.error) console.warn(res.error); });
  }

  function attach() {
    let doc;
    try { doc = frame.contentDocument; } catch (e) { doc = null; }
    if (!doc) return;

    function updateScreen() {
      try {
        current = frame.contentWindow.location.pathname + frame.contentWindow.location.hash;
      } catch (e) {}
      logEvent({ type: 'nav', screen_id: current, x: null, y: null, hit: null, target: null });
    }
    updateScreen();

    // Catch SPA-style navigation that doesn't trigger a full page reload
    // (client-side routers using pushState/replaceState, or hash-based routes).
    try {
      const win = frame.contentWindow;
      const pushState = win.history.pushState;
      const replaceState = win.history.replaceState;
      win.history.pushState = function () { pushState.apply(this, arguments); updateScreen(); };
      win.history.replaceState = function () { replaceState.apply(this, arguments); updateScreen(); };
      win.addEventListener('hashchange', updateScreen);
      win.addEventListener('popstate', updateScreen);
    } catch (e) {}

    doc.addEventListener('click', function (e) {
      const x = e.clientX / W;
      const y = e.clientY / H;
      let hit = false, label = null;
      const el = e.target;
      const interactive = el && el.closest ? el.closest('a,button,input,select,textarea,[onclick],[role="button"],[tabindex]') : null;
      if (interactive) {
        hit = true;
        label = (interactive.getAttribute('aria-label') || interactive.getAttribute('title') ||
          (interactive.textContent || '').trim() || interactive.tagName.toLowerCase()).slice(0, 60);
      }
      logEvent({ type: 'tap', screen_id: current, x: x, y: y, hit: hit, target: label });
    }, true);
  }

  frame.addEventListener('load', attach);
  frame.src = src;

  // Listen for a remote "restart" signal from the watch dashboard.
  let lastRestartAt = null;
  supabase
    .channel('session-ctl-' + sessionId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'sessions', filter: 'id=eq.' + sessionId }, function (payload) {
      const r = payload.new && payload.new.restart_at;
      if (r != null && r !== lastRestartAt) {
        lastRestartAt = r;
        const bust = src.indexOf('?') >= 0 ? '&' : '?';
        frame.src = src + bust + '_r=' + Date.now();
      }
    })
    .subscribe();
}
</script>
</body>
</html>
